<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>俄罗斯方块</h1>
        <div class="game-wrapper">
            <div class="game-board">
            <canvas id="gameCanvas" width="448" height="504"></canvas>
        </div>
            <div class="game-info">
                <div class="info-row">
                    <div class="info-item info-small">
                        <h3>分数</h3>
                        <div id="score">0</div>
                    </div>
                    <div class="info-item info-small">
                        <h3>等级</h3>
                        <div id="level">1</div>
                    </div>
                    <div class="info-item info-small">
                        <h3>行数</h3>
                        <div id="lines">0</div>
                    </div>
                </div>
                <div class="info-item">
                    <h3>下一个</h3>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>
                <div class="controls">
                    <h3>控制</h3>
                    <div class="control-buttons">
                        <button class="btn btn-up" onclick="moveUp()">↑</button>
                        <div class="btn-row">
                            <button class="btn btn-left" onclick="moveLeft()">←</button>
                            <button class="btn btn-down" onclick="moveDown()">↓</button>
                            <button class="btn btn-right" onclick="moveRight()">→</button>
                        </div>
                        <button class="btn btn-space" onclick="drop()">快速下落</button>
                    </div>
                </div>
                <div class="game-controls">
                    <button id="startBtn" onclick="startGame()">开始游戏</button>
                    <button id="pauseBtn" onclick="pauseGame()">暂停</button>
                    <button id="resetBtn" onclick="resetGame()">重置</button>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
